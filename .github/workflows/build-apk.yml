name: Build Signed Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # ============================================================
      # إنشاء مشروع Android
      # ============================================================
      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.khabeir \
            --project-name delalatshabasha \
            .

      # ============================================================
      # تثبيت Application ID
      # ============================================================
      - name: Set Application ID
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'applicationId\s*=\s*"[^"]*"',
              'applicationId = "com.khabeir.delalatshabasha"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      # ============================================================
      # صلاحية الإنترنت + اسم التطبيق
      # ============================================================
      - name: Configure Android Manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<application',
                  permission + '\n\n    <application',
                  1
              )

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="دلالة شبشة"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      # ============================================================
      # حذف اختبار Flutter الافتراضي
      # ============================================================
      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      # ============================================================
      # التحقق من صورة الأيقونة
      # ============================================================
      - name: Verify launcher icon source
        run: |
          test -f assets/icon/delalat_shabasha_icon.png

          echo "Launcher icon source:"
          file assets/icon/delalat_shabasha_icon.png

      # ============================================================
      # تثبيت الحزم
      # ============================================================
      - name: Get dependencies
        run: |
          flutter pub get

      # ============================================================
      # إنشاء أيقونات Android
      # ============================================================
      - name: Generate Android launcher icons
        run: |
          dart run flutter_launcher_icons

      # ============================================================
      # فحص الأيقونات
      # ============================================================
      - name: Verify generated Android icons
        run: |
          echo "===== GENERATED ICON FILES ====="

          find android/app/src/main/res \
            -type f \
            \( -name "*launcher*" -o -name "*ic_launcher*" \) \
            -print | sort

          echo
          echo "===== MANIFEST ICON ====="

          grep -n "android:icon\|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

      # ============================================================
      # إعداد Keystore
      # ============================================================
      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/delalat_shabasha.jks

          test -s android/app/delalat_shabasha.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=delalat_shabasha
          storeFile=../app/delalat_shabasha.jks
          EOF

          echo "Signing keystore configured successfully."

      # ============================================================
      # إعداد توقيع Android
      # ============================================================
      - name: Configure Android signing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing_block = r'''
          import java.util.Properties
          import java.io.FileInputStream

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''

          if 'keystorePropertiesFile' not in s:
              s = signing_block + '\n' + s

          signing_config = r'''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''

          if 'create("release")' not in s:
              s = s.replace(
                  'android {',
                  'android {\n' + signing_config,
                  1
              )

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(s)
          PY

      # ============================================================
      # التحقق من إعدادات التوقيع
      # ============================================================
      - name: Verify signing configuration
        run: |
          echo "===== APPLICATION ID ====="
          grep -n "applicationId" android/app/build.gradle.kts || true

          echo
          echo "===== SIGNING CONFIG ====="
          grep -n -A8 -B2 "create(\"release\")" android/app/build.gradle.kts || true

          echo
          echo "===== KEY PROPERTIES ====="
          grep -E "^(keyAlias|storeFile)=" android/key.properties

      # ============================================================
      # تحليل المشروع
      # ============================================================
      - name: Analyze
        run: |
          flutter analyze

      # ============================================================
      # بناء APK موقّع
      # ============================================================
      - name: Build signed APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://newtahnyvxbydpsbxgew.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # ============================================================
      # بناء AAB موقّع
      # ============================================================
      - name: Build signed AAB
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://newtahnyvxbydpsbxgew.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # ============================================================
      # رفع APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: delalat-shabasha-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ============================================================
      # رفع AAB
      # ============================================================
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: delalat-shabasha-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
