name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # إنشاء مشروع Android لأن المستودع لا يحتوي على مجلد android
      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.khabeir \
            --project-name delalatshabasha \
            .

      # إضافة صلاحية الإنترنت
      - name: Add Android Internet permission
        run: |
          python - <<'PY2'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if 'android.permission.INTERNET' not in s:
              marker = '<application'
              s = s.replace(
                  marker,
                  permission + '\n\n    ' + marker,
                  1
              )

          p.write_text(s)
          PY2

      # اسم التطبيق الظاهر للمستخدم
      - name: Set Arabic app name
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="دلالة شبشة"',
              s,
              count=1
          )

          p.write_text(s)
          PY2

      # التأكد من وجود صورة الأيقونة
      - name: Verify launcher icon source
        run: |
          test -f assets/icon/delalat_shabasha_icon.png

          echo "Launcher icon source:"
          file assets/icon/delalat_shabasha_icon.png

      # إزالة اختبار Flutter الافتراضي
      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      # تثبيت الحزم
      - name: Get dependencies
        run: flutter pub get

      # توليد جميع أيقونات Android من صورة PNG الجديدة
      - name: Generate Android launcher icons
        run: |
          dart run flutter_launcher_icons

      # فحص وجود الأيقونات المولدة
      - name: Verify generated Android icons
        run: |
          echo "===== GENERATED ICON FILES ====="

          find android/app/src/main/res \
            -type f \
            \( -name "*launcher*" -o -name "*ic_launcher*" \) \
            -print | sort

          echo
          echo "===== MANIFEST ICON ====="

          grep -n "android:icon\|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

      # تحليل المشروع
      - name: Analyze
        run: flutter analyze

      # بناء APK
      - name: Build APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://newtahnyvxbydpsbxgew.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delalat-shabasha-apk
          path: build/app/outputs/flutter-apk/app-release.apk